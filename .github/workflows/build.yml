name: Build APK

on:
  push:
    branches: [ main ]
    # Pushes that only change documentation (any .md file) don't make a new app version.
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The keystore is in the repo only encrypted; SIGNING_PASSWORD (GitHub Secret) unlocks it.
      - name: Unlock signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_PASSWORD secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:SIGNING_PASSWORD

      # Version 1.0.<build>; the last number is also Android's versionCode (the updater compares it).
      - name: Version number
        run: echo "APP_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: evremote
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        # Compile errors also become annotations, readable without signing in to see the log.
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong" -A1 build.log | grep -v "^--$" | head -30 | sed "s/^/::error::/"
            exit 1
          }

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "EvRemote-$APP_VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk EvRemote.apk

      # Start the app on an emulator before releasing, so a build that crashes on launch never ships.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Smoke test (app must start without crashing)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r EvRemote.apk
            adb logcat -c
            adb shell am start -W -n lt.vilsab.evremote/no.lionflow.app.MainActivity
            sleep 15
            adb logcat -d -v brief AndroidRuntime:E '*:S' > crash.txt || true
            if grep -q "Process: lt.vilsab.evremote" crash.txt || ! adb shell pidof lt.vilsab.evremote; then cat crash.txt; echo "::error::EV Remote crashed on launch"; exit 1; fi
            echo "App started fine"

      - name: Release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$MSG" ] || MSG="$(git log -1 --format=%B)"
          printf '%s\n' "$MSG" | grep -viE '^(co-authored-by|claude-session|signed-off-by):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: EV Remote ${{ env.APP_VERSION_NAME }}
          body_path: notes.md
          files: |
            EvRemote-*.apk
            EvRemote.apk
          make_latest: true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
